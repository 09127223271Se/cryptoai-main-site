# Wakes the free Render server every 10 minutes (Render free sleeps after 15 idle minutes) so the hourly Telegram agent keeps running.
# It only calls the site; drafts are still sent to you for approval in Telegram.
name: agent-wakeup
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake site and run agent tick
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 120 "https://cryptoai-main-site.onrender.com/api/agent/run" || true
